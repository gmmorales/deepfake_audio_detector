[project]
name = "deepfake-audio-detector"
version = "0.1.0"
description = "Sistema de clasificación de audio impulsado por IA"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.28.0",
    "tensorflow==2.15.0",
    "tensorflow-intel==2.15.0; sys_platform == 'win32'",
    "librosa==0.10.1",
    "numpy==1.26.4",
    "python-multipart==0.0.9",
    "setuptools<81",
]

[tool.uv]
package = false
exclude-dependencies = ["tensorflow-io-gcs-filesystem"]
